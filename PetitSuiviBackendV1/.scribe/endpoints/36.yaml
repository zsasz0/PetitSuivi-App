      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      photo:
        custom: []
        name: photo
        description: 'The image file (JPEG/PNG, max 5MB).'
        required: true
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      child_ids:
        custom: []
        name: child_ids
        description: 'List of ChildIDs to share the photo with.'
        required: true
        example:
          - 8
          - 9
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      expires_in_days:
        custom: []
        name: expires_in_days
        description: 'optional Days until photo expires.'
        required: false
        example: 30
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      child_ids:
        - 8
        - 9
      expires_in_days: 30
    fileParameters:
