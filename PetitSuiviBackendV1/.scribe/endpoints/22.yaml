  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/admin/payments/{inscriptionId}/{childId}/transactions'
    metadata:
      custom: []
      groupName: 'Admin - Payments'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Record a Payment Instalment (Transaction)'
      description: |-
        Creates a new Partialpayment row linked to the Payment that matches
        the given inscription + child combination. The frontend calls this
        endpoint from both the manual payment form and the monthly schedule
        checkbox.

        Route: POST /api/admin/payments/{inscriptionId}/{childId}/transactions

        Validation rules:
        - amount must be > 0
        - amount must not exceed the remaining balance
        - date is required and must be a valid date
        - target_month is optional (YYYY-MM), required for monthly payments
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      inscriptionId:
        custom: []
        name: inscriptionId
        description: 'The InscriptionID.'
        required: true
        example: 101
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      childId:
        custom: []
        name: childId
        description: 'The ChildID.'
        required: true
        example: 45
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      inscriptionId: 101
      childId: 45
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      amount:
        custom: []
        name: amount
        description: 'The instalment amount in TND.'
        required: true
        example: '150.00'
        type: numeric
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      date:
        custom: []
        name: date
        description: 'The payment date (YYYY-MM-DD).'
        required: true
        example: '2025-10-01'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      target_month:
        custom: []
        name: target_month
        description: 'optional The month this payment covers (YYYY-MM).'
        required: false
        example: 2025-09
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      amount: '150.00'
      date: '2025-10-01'
      target_month: 2025-09
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: |-
          {
            "success": true,
            "message": "Transaction recorded.",
            "data": {
              "PartialpaymentID": 301,
              "PaymentID": 250,
              "Value": 150.00,
              "Date": "2025-10-01",
              "Targetmonth": "2025-09"
            }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: |-
          {
            "success": false,
            "message": "Payment record not found for this inscription/child."
          }
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: |-
          {
            "success": false,
            "message": "Amount exceeds remaining balance."
          }
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
