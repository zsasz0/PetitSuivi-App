      - PATCH
    uri: 'api/admin/inscriptions/{id}/status'
    metadata:
      custom: []
      groupName: 'Admin - Inscriptions'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Update inscription status'
      description: |-
        Changes the status of an inscription to approved, rejected, or pending.
        When approving with a class_id, assigns the child to that class via the
        ChildClass pivot table. When rejecting or resetting to pending, removes
        the ChildClass assignment. Also manages Payment record creation on approval.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: 'The InscriptionID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      status:
        custom: []
        name: status
        description: 'The target status: "approved", "rejected", or "pending".'
        required: true
        example: approved
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      class_id:
        custom: []
        name: class_id
        description: 'Optional class ID for assignment on approval.'
        required: false
        example: 5
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      status: approved
      class_id: 5
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "success": true,
            "message": "Inscription status updated.",
            "data": {
              "id": 1,
              "status": { "id": 2, "name": "approved" },
              "class": { "id": 5, "name": "Moyenne Section B" }
