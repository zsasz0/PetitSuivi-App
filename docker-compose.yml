services:
  mysql:
    image: mysql:8.4
    container_name: petitsuivi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petitsuivi}
      MYSQL_USER: ${MYSQL_USER:-petitsuivi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petitsuivi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./PetitSuiviBackendV1
    container_name: petitsuivi-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-petitsuivi}
      DB_USERNAME: ${MYSQL_USER:-petitsuivi}
      DB_PASSWORD: ${MYSQL_PASSWORD:-petitsuivi}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontreact:
    build:
      context: ./PetitSuiviAdminFrontEndV1
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    container_name: petitsuivi-frontreact
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5000}:80"

  copilot:
    build:
      context: ./copilot-api
    container_name: petitsuivi-copilot
    restart: unless-stopped
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
    ports:
      - "${COPILOT_PORT:-4141}:4141"
    volumes:
      - copilot-data:/root/.local/share/copilot-api

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: petitsuivi-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

volumes:
  mysql-data:
  copilot-data:
